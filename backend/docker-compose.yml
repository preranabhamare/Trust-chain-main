version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trustchain-postgres
    restart: always
    environment:
      POSTGRES_USER: trustchain_user
      POSTGRES_PASSWORD: trustchain_password
      POSTGRES_DB: trustchain_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
